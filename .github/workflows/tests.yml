name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test with line and branch coverage
        run: >-
          python -m pytest -q --cov=app --cov-branch
          --cov-report=term-missing --cov-report=xml
          --cov-fail-under=85
      - name: Compile application and tests
        run: python -m compileall -q app tests
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit -d audit_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-postgres.txt
      - name: Run PostgreSQL migration integration tests
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://audit:audit@localhost:5432/audit_test
          POSTGRES_TEST_REQUIRED: "1"
        run: python -m pytest tests/postgres -q -rs --junitxml=postgres-test-results.xml
      - name: Require PostgreSQL tests to execute
        shell: bash
        run: >-
          python -c "import sys, xml.etree.ElementTree as ET;
          root=ET.parse('postgres-test-results.xml').getroot();
          skipped=len(root.findall('.//testcase/skipped'));
          print(f'PostgreSQL skipped tests: {skipped}');
          sys.exit(1 if skipped else 0)"
      - name: Compile application and tests
        run: python -m compileall -q app tests
      - name: Upload PostgreSQL test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-results
          path: postgres-test-results.xml

  rate-limit-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run required distributed rate-limit tests
        env:
          AUDIT_RATE_LIMIT_BACKEND: redis
          AUDIT_RATE_LIMIT_REDIS_URL: redis://localhost:6379/15
          AUDIT_RATE_LIMIT_REQUIRED: "1"
        run: python -m pytest tests/test_rate_limiting_distributed.py -q -rs --junitxml=rate-limit-test-results.xml
      - name: Require Redis tests to execute
        shell: bash
        run: >-
          python -c "import sys, xml.etree.ElementTree as ET;
          root=ET.parse('rate-limit-test-results.xml').getroot();
          skipped=len(root.findall('.//testcase/skipped'));
          print(f'Redis rate-limit skipped tests: {skipped}');
          sys.exit(1 if skipped else 0)"
      - name: Upload Redis test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rate-limit-test-results
          path: rate-limit-test-results.xml
